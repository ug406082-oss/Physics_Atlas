# Physics Atlas sandbox.
#
# Isolation model:
#   - only ./Physics_Atlas is mounted (as /workspace); the rest of the host is invisible
#   - the container runs on an INTERNAL network with no route to the internet
#   - the only reachable peer is the local `model` (Ollama) server
#   - no Docker socket, no privileged mode, all capabilities dropped, non-root
#   - 2 CPUs / 4 GB RAM / bounded pids and scratch space
#
# The permission file (.sandbox/opencode.json) is mounted read-only from OUTSIDE
# /workspace so the agent cannot relax its own rules.

name: physics-atlas-sandbox

services:
  model:
    image: ollama/ollama:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - llm

  opencode:
    build:
      context: ..
      dockerfile: .sandbox/Dockerfile
    image: physics-atlas-opencode:local
    container_name: physics-atlas-opencode
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    user: "1000:1000"
    restart: "no"

    # No privilege: read-only rootfs, no capabilities, no-setuid binaries.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Bounded, non-persistent scratch space.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000
      - /home/dev/.config:rw,nosuid,nodev,size=32m,uid=1000,gid=1000

    volumes:
      # The project, and nothing else.
      - ../:/workspace
      # Enforced permissions, read-only, outside the workspace.
      - ./opencode.json:/etc/opencode/opencode.json:ro
      # Session history / database (persistent).
      - opencode-data:/data
      # Provider registry + provider SDK cache (seeded from the image).
      - opencode-cache:/home/dev/.cache

    environment:
      HOME: /home/dev
      XDG_CONFIG_HOME: /home/dev/.config
      XDG_CACHE_HOME: /home/dev/.cache
      XDG_DATA_HOME: /data
      OPENCODE_CONFIG: /etc/opencode/opencode.json
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "1"
      OLLAMA_BASE_URL: http://model:11434/v1

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
          pids: 512

    depends_on:
      - model
    networks:
      - llm

networks:
  # internal: true => no gateway to the internet; only peers on this network.
  llm:
    internal: true
    driver: bridge

volumes:
  # Explicit names so the one-time model pull can target them from a helper container.
  ollama-models:
    name: physics-atlas-ollama-models
  opencode-data:
    name: physics-atlas-opencode-data
  opencode-cache:
    name: physics-atlas-opencode-cache
