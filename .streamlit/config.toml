[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#060d1a"
secondaryBackgroundColor = "#0f2138"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
# enableCORS / enableXsrfProtection are deliberately left alone. Setting
# enableCORS = false alongside XSRF protection is contradictory - Streamlit
# overrides CORS to true anyway and prints a warning on every start - and on
# Community Cloud these two are managed by the platform regardless.

[browser]
gatherUsageStats = false
